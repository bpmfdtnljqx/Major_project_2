<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; }
    #editor {
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      padding: 10px 12px;
      font-family: "Consolas", "Menlo", "DejaVu Sans Mono", monospace;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid rgba(128, 128, 128, 0.35);
      border-radius: 6px;
      background: #0e1117;      /* Streamlit 深色代码区 */
      color: #e6edf3;
      tab-size: 4;
      outline: none;
    }
    #editor:focus { border-color: #4b8bef; }
    #editor::placeholder { color: #6b6f76; }
    .hint { font-size: 11px; color: #7a7d85; margin-top: 2px; }
  </style>
</head>
<body>
  <textarea id="editor" spellcheck="false" placeholder="在此输入代码，Tab 键可缩进……"></textarea>
  <div class="hint">Tip: Tab 缩进 / Shift+Tab 反缩进 / 可拖动右下角调节高度</div>

  <script>
    var editor = document.getElementById("editor");
    var INDENT = "    ";
    var firstRender = true;

    function send() {
      if (window.Streamlit && window.Streamlit.setComponentValue) {
        window.Streamlit.setComponentValue(editor.value);
      }
    }

    // 仅在失焦 / 提交等需要取值时回传，避免每次击键触发整页 rerun（否则会闪烁）。
    // 键入内容始终保留在 textarea 中；用户点击"提交评测"等外部控件时 blur 会先触发回传，
    // 故 Python 侧在提交时总能拿到最新代码。
    editor.addEventListener("input", function () { /* 不回传，避免 rerun 闪烁 */ });

    // 失焦：立即回传，保证提交/切页前值已同步
    editor.addEventListener("blur", send);

    // Tab 缩进后手动回传一次（Tab 是显式动作，不依赖 blur）
    function afterTab() { send(); }

    function insertAt(start, end, text) {
      editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
      return start + text.length;
    }

    editor.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      e.preventDefault();
      var start = editor.selectionStart, end = editor.selectionEnd;

      if (!e.shiftKey) {
        // 缩进
        if (start === end) {
          var p = insertAt(start, end, INDENT);
          editor.selectionStart = editor.selectionEnd = p;
        } else {
          var lineStart = editor.value.lastIndexOf("\n", start - 1) + 1;
          var sel = editor.value.slice(lineStart, end);
          var added = sel.replace(/^/gm, INDENT);
          editor.value = editor.value.slice(0, lineStart) + added + editor.value.slice(end);
          editor.selectionStart = start + INDENT.length;
          editor.selectionEnd = end + (added.length - sel.length);
        }
      } else {
        // 反缩进：每行开头去掉最多 4 个空格
        var ls = editor.value.lastIndexOf("\n", start - 1) + 1;
        var blk = editor.value.slice(ls, end);
        var out = blk.replace(/^( {1,4})/gm, "");
        var removedStart = 0;
        var cursorLine = editor.value.slice(ls, start);
        var lead = cursorLine.match(/^( {1,4})/);
        if (lead) removedStart = lead[1].length;
        editor.value = editor.value.slice(0, ls) + out + editor.value.slice(end);
        editor.selectionStart = Math.max(start - removedStart, ls);
        editor.selectionEnd = editor.selectionStart + (out.length - (end - ls - removedStart));
      }
      afterTab();
    });

    function onRender(event) {
      var props = event.detail.args || {};
      if (typeof props.height === "number") {
        editor.style.height = props.height + "px";
      }
      // 仅在"编辑器未被聚焦"时应用外部传入的 code（避免与用户输入竞争造成闪烁/丢字）。
      if (typeof props.code === "string") {
        var isTyping = document.activeElement === editor;
        if (firstRender) {
          editor.value = props.code;
          firstRender = false;
        } else if (!isTyping && props.code !== editor.value) {
          editor.value = props.code;
        }
      }
    }
    if (window.Streamlit) {
      window.Streamlit.events.addEventListener(window.Streamlit.RENDER_EVENT, onRender);
      window.Streamlit.setComponentReady();
    }
  </script>
</body>
</html>
